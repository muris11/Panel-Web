# RAYXO panel — Nginx site
#
# Two jobs: serve the panel on the control port, and pass everything to the Go
# process, which serves both the API and the embedded interface.
#
# The panel sets its own Content-Security-Policy, X-Frame-Options and
# Referrer-Policy; Nginx does not repeat them, so there is one place to change.

upstream rayxo_panel {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 2222 ssl http2;
    listen [::]:2222 ssl http2;
    server_name panel.example.com;

    ssl_certificate     /etc/rayxo/panel.crt;
    ssl_certificate_key /etc/rayxo/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Sign-in bodies are small; anything larger is not this application.
    client_max_body_size 2m;

    # A panel is not a public site.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://rayxo_panel;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent calls can wait on a slow disk; a sign-in calls bcrypt.
        proxy_connect_timeout 5s;
        proxy_read_timeout    70s;
        proxy_send_timeout    30s;
    }

    # The panel answers /api/v1/health with 503 when it cannot reach MariaDB
    # or rayxod, so this is a real readiness check, not just "is the socket up".
    location = /api/v1/health {
        proxy_pass http://rayxo_panel;
        access_log off;
    }
}
